name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - name: Type check
        run: pnpm check

      - run: pnpm build

      - name: Validate built HTML
        run: pnpm check-html

      - name: Check local links resolve
        run: pnpm check-links
